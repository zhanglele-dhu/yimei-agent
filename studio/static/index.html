<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>王伟医美自媒体一键发布小助手 · 工作台</title>
  <link rel="stylesheet" href="/static/style.css?v=cases-20260926-4">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="mark">王</div><div><span class="brand-name">王伟医美自媒体</span><small class="brand-sub">一键发布小助手</small></div></div>
      <div class="topnav"><span id="connectionState">未连接</span><button class="feedback" id="libraryBtn" type="button">案例资料</button><button class="feedback" id="connectBtn" type="button">连接工作台</button><button class="feedback" id="feedbackBtn" type="button">反馈</button></div>
    </header>
    <main class="page">
      <section class="screen active" id="home"></section>
      <section class="screen" id="topics"></section>
      <section class="screen" id="modes"></section>
      <section class="screen" id="create"></section>
      <section class="screen" id="publish"></section>
    </main>
  </div>
  <div class="modal" id="accessModal"><div class="modal-box"><header><h2>连接工作台</h2><button class="close" id="closeAccess" type="button">×</button></header><p>请输入启动脚本配置的访问口令。口令只保存在当前浏览器会话中。</p><input id="accessToken" type="password" placeholder="STUDIO_ACCESS_TOKEN"><button class="btn primary" id="saveAccess" type="button">连接</button></div></div>
  <div class="modal" id="feedbackModal"><div class="modal-box"><header><h2>发布反馈</h2><button class="close" id="closeFeedback" type="button">×</button></header><p>帖子发布后如果遇到限流、违规或审核提示，把平台返回的原文粘贴在这里。</p><select id="feedbackType"><option>限流</option><option>违规</option><option>审核不通过</option><option>其他</option></select><textarea id="feedbackText" placeholder="粘贴小红书返回的具体文案，不要只写“被封了”"></textarea><button class="btn primary" id="submitFeedback" type="button">保存反馈并请求分析</button></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app.js?v=cases-20260926-4"></script>
</body>
</html>
